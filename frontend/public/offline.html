<!doctype html>
<html lang="es-GT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020817" />
    <title>Vivent sin conexion</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top right, rgba(37, 99, 235, 0.35), transparent 32rem),
          linear-gradient(135deg, #020817 0%, #0f172a 48%, #082f49 100%);
        color: #f8fafc;
      }

      main {
        width: min(28rem, calc(100vw - 2rem));
        padding: 2rem;
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 1.5rem;
        background: rgba(15, 23, 42, 0.72);
        box-shadow: 0 1.5rem 5rem rgba(2, 8, 23, 0.55);
        backdrop-filter: blur(18px);
      }

      img {
        width: 4rem;
        height: 4rem;
        border-radius: 1rem;
        box-shadow: 0 1rem 3rem rgba(37, 99, 235, 0.35);
      }

      h1 {
        margin: 1.5rem 0 0.75rem;
        font-size: clamp(1.75rem, 6vw, 2.5rem);
        line-height: 1;
        letter-spacing: -0.05em;
      }

      p {
        margin: 0;
        color: #cbd5e1;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        margin-top: 1.5rem;
        color: #67e8f9;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 2px solid #67e8f9;
        outline-offset: 0.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192x192.png" alt="Vivent" />
      <h1>No hay conexion</h1>
      <p>
        Vivent necesita conexion con el backend para validar permisos, inventario, FIFO y reportes. Revisa tu red e intenta cargar la aplicacion de nuevo.
      </p>
      <a href="/login">Volver a intentar</a>
    </main>
  </body>
</html>
