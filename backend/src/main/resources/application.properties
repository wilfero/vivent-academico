spring.application.name=vivent

spring.datasource.url=${VIVENT_DB_URL:jdbc:postgresql://localhost:5433/vivent}
spring.datasource.username=${VIVENT_DB_USERNAME:vivent}
spring.datasource.password=${VIVENT_DB_PASSWORD:vivent}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.out-of-order=true

spring.docker.compose.enabled=false
spring.docker.compose.file=compose.yaml

vivent.tenant.public-base-domain=${VIVENT_PUBLIC_BASE_DOMAIN:corpoviva.com}
vivent.security.jwt.issuer=${VIVENT_JWT_ISSUER:vivent}
vivent.security.jwt.secret=${VIVENT_JWT_SECRET:ChangeThisLocalDevelopmentSecretKeyForJwtOnly1234567890}
vivent.security.jwt.access-token-ttl=${VIVENT_JWT_ACCESS_TOKEN_TTL:PT8H}

# Platform (SaaS master) administration
vivent.platform.cookie-name=${VIVENT_PLATFORM_COOKIE_NAME:vivent_platform_session}
vivent.platform.cookie-secure=${VIVENT_PLATFORM_COOKIE_SECURE:false}
vivent.platform.session-ttl=${VIVENT_PLATFORM_SESSION_TTL:PT12H}
vivent.platform.max-failed-attempts=${VIVENT_PLATFORM_MAX_FAILED_ATTEMPTS:5}
vivent.platform.lock-duration=${VIVENT_PLATFORM_LOCK_DURATION:PT15M}
vivent.platform.bootstrap.enabled=${VIVENT_PLATFORM_BOOTSTRAP_ENABLED:true}
vivent.platform.bootstrap.username=${VIVENT_PLATFORM_BOOTSTRAP_USERNAME:admin}
vivent.platform.bootstrap.password=${VIVENT_PLATFORM_BOOTSTRAP_PASSWORD:admin}
