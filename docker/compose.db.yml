# Solo base de datos PostgreSQL para desarrollo
# Uso: cd docker ; docker compose -f compose.db.yml up -d
services:
  db:
    image: postgres:17-alpine
    container_name: vivent-academico-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: vivent
      POSTGRES_USER: vivent
      POSTGRES_PASSWORD: vivent
    volumes:
      - vivent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivent -d vivent"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  vivent_pgdata:
